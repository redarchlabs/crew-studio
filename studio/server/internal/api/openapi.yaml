openapi: 3.1.0
info:
  title: Crew Studio API
  version: "1.0"
  description: |
    Start CrewAI work from other systems and read the results. Every response uses the envelope
    `{ success, data, error: { code, message, details }, meta }`. The full contract (including the admin and
    editing endpoints) is in studio/docs/api.md.

    Authenticate with a service account API key (`Authorization: Bearer csk_...`), or call a webhook trigger
    with its own token. Send `Idempotency-Key` on POSTs that start work so retries are safe.
servers:
  - url: /api
security:
  - apiKey: []
  - session: []
tags:
  - { name: Sign-in, description: Who you are and how you signed in }
  - { name: Work orders, description: Execute a crew with a brief and files; journal and full output }
  - { name: Runs, description: Executions, their events, LLM calls, files and journal }
  - { name: Crews }
  - { name: Agents }
  - { name: Tasks }
  - { name: Schedules }
  - { name: Triggers, description: Webhooks other systems call }
  - { name: Configuration, description: LLMs, prices, settings, tools }
  - { name: History }
  - { name: Account, description: Your own API keys }
  - { name: Help, description: In-app help filtered by your permissions }
  - { name: Connections, description: "Credentials for outside systems (Jira, Linear, KM2, HTTP, Slack, Teams, email). Secrets are write-only: they can be replaced, never read." }
  - { name: Crew state, description: "A crew's notes (versioned working memory) and action log, and which connections it may use" }
  - { name: Run state, description: "Called by a running crew's state tools with the run's own token (csr_...). Not for people or API keys." }
  - { name: Memory, description: "Soft lessons a crew learns between runs, recalled by similarity before each task (state.view to see, state.manage to change). Scopes are paths relative to the crew, such as / or /people/sam." }
  - { name: Chat, description: "Talk to a crew's front desk agent (crews.chat). Each message is a short run of kind chat; changes it wants wait for the person's Confirm." }
  - { name: Human input, description: "A crew's rules for when its agents ask a person, and the questions waiting on you. A run with an open question is running and waits for the answer." }
  - { name: Admin, description: "People, service accounts, roles, functional areas, sign-in settings, audit. API keys may read these but not change them (or read signing secrets): that needs a signed-in session." }
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: Service account API key (csk_<prefix>_<secret>), created under Admin > Service accounts.
    session:
      type: apiKey
      in: cookie
      name: crewstudio_session
      description: Browser session (set by signing in). The API explorer page uses it automatically.
    triggerToken:
      type: http
      scheme: bearer
      description: Trigger token (cst_<prefix>_<secret>), shown once when the trigger is created or rotated.
    runToken:
      type: http
      scheme: bearer
      description: A run's own token (csr_...), given to the runner on stdin when the run starts. It expires shortly after the run ends.
  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 200 }
      description: Repeating a request with the same key returns the first result instead of starting more work.
    limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
  responses:
    Error:
      description: Failure envelope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    TrackingItemInput:
      type: object
      required: [connection_id, item_ref]
      properties:
        connection_id: { type: string, format: uuid }
        item_ref: { type: string, examples: [PRJ-10] }
        project: { type: string, description: "A name such as Atlas; empty uses the item's project key" }
        include_children: { type: string, enum: [all, direct, none], default: all }
        note: { type: string, maxLength: 1000 }
        lead_account_id: { type: string, description: "Who escalations go to instead of the project lead (a tracker account id)" }
        schedule_id: { type: [string, "null"], format: uuid, description: "Only that schedule's tracking_list watch reads it; null for the whole crew" }
    TrackingItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        crew_id: { type: string, format: uuid }
        schedule_id: { type: [string, "null"], format: uuid, description: "null: crew-wide" }
        schedule_name: { type: string }
        connection_id: { type: string, format: uuid }
        connection_name: { type: string }
        connection_kind: { type: string, enum: [jira, linear] }
        project: { type: string }
        item_ref: { type: string, examples: [PRJ-10] }
        include_children: { type: string, enum: [all, direct, none] }
        note: { type: string }
        lead_account_id: { type: string, description: "Who escalations go to instead of the project lead (a tracker account id); empty for none" }
        lead_name: { type: string, description: "The lead's name from the connection's people map; empty when the account is not in it" }
        added_by: { type: [string, "null"], format: uuid }
        added_by_name: { type: string }
        added_at: { type: string, format: date-time }
        removed_at: { type: [string, "null"], format: date-time }
        removed_by_name: { type: string }
    ErrorEnvelope:
      type: object
      properties:
        success: { const: false }
        data: { type: "null" }
        error:
          type: object
          properties:
            code: { type: string, examples: [validation_failed, unauthenticated, forbidden, not_found, conflict, rate_limited] }
            message: { type: string }
            details: { type: array, items: { type: string } }
    RunStatus:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]
    Run:
      type: object
      properties:
        id: { type: string, format: uuid }
        crew_id: { type: [string, "null"], format: uuid }
        crew_name: { type: string }
        status: { $ref: "#/components/schemas/RunStatus" }
        inputs: { type: object, additionalProperties: { type: string } }
        budget_usd: { type: number }
        output: { type: [string, "null"], description: Final output (markdown) }
        error: { type: [string, "null"] }
        cost_usd: { type: [number, "null"] }
        trigger_type: { type: string, enum: [manual, api, schedule, webhook, work_order] }
        kind: { type: string, enum: [crew, chat], description: "crew for crew runs, chat for one turn of a crew chat" }
        work_order_id: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        task_outputs:
          type: array
          items:
            type: object
            properties:
              position: { type: integer }
              task_name: { type: string }
              agent_role: { type: string }
              raw: { type: string }
    ChatSettings:
      type: object
      properties:
        enabled: { type: boolean }
        front_desk_agent_id: { type: [string, "null"], format: uuid, description: One of the crew's agents; required when enabled }
        llm_id: { type: [string, "null"], format: uuid, description: "A model for chat instead of the front desk's own (usually cheaper)" }
        daily_budget_usd: { type: number, exclusiveMinimum: 0, maximum: 100, description: What one conversation may spend in any 24 hours (default 1.0) }
        person_daily_budget_usd: { type: number, exclusiveMinimum: 0, maximum: 1000, description: What one person may spend on the crew's chat in any 24 hours over all their conversations (default 5.0) }
        crew_id: { type: string, format: uuid, readOnly: true }
        updated_by_name: { type: string, readOnly: true }
        updated_at: { type: [string, "null"], format: date-time, readOnly: true }
    AgentChatSettings:
      type: object
      properties:
        enabled: { type: boolean }
        llm_id: { type: [string, "null"], format: uuid, description: "A model for the agent in chat instead of its own (usually cheaper); specialists keep their own" }
        specialist_ids: { type: array, maxItems: 8, items: { type: string, format: uuid }, description: "Agents it may ask in the same turn, in order; each with a role of its own" }
        crew_ids: { type: array, maxItems: 10, items: { type: string, format: uuid }, description: Crews it may propose a work order on }
        connection_ids: { type: array, maxItems: 10, items: { type: string, format: uuid }, description: "Connections its tracker and KM2 read tools may use in chat, in order: Jira, Linear, KM2 issues or KM2, at most one KM2 (otherwise 422). You may only add connections in your areas, and adding one needs connections.view (403); saved ones are kept. A turn uses those that are enabled and share an area with the person chatting and the agent." }
        daily_budget_usd: { type: number, exclusiveMinimum: 0, maximum: 100, description: What one conversation may spend in any 24 hours (default 1.0) }
        person_daily_budget_usd: { type: number, exclusiveMinimum: 0, maximum: 1000, description: What one person may spend chatting with the agent in any 24 hours (default 5.0) }
        handoffs_enabled: { type: boolean, description: "The agent may propose hand-offs: background runs for work too long for one turn, each started by the person's Confirm" }
        handoff_budget_usd: { type: number, exclusiveMinimum: 0, maximum: 100, description: "What one hand-off may spend (default 0.5); the conversation's and the person's daily budgets also apply" }
        handoff_timeout_minutes: { type: integer, minimum: 1, maximum: 180, description: How long one hand-off may run (default 20) }
        max_active_handoffs: { type: integer, minimum: 1, maximum: 5, description: Hand-offs running at once in one conversation (default 2); one person may have 5 with one agent }
        questions_enabled: { type: boolean, description: "During a hand-off, the lead may bring a specialist's question to the person (a Waiting for you card in the conversation); specialists may always ask the lead" }
        question_rules: { type: string, maxLength: 4000, description: When the lead should ask the person, in plain language; required when questions_enabled }
        question_timeout_minutes: { type: integer, minimum: 1, maximum: 180, description: "How long a question waits for an answer (default 30); never past a minute before the hand-off's own deadline, which does not pause while it waits" }
        question_on_timeout: { type: string, enum: [proceed, fail], description: "proceed (default): the hand-off carries on and states its assumption; fail: it stops, keeping what was written" }
        max_questions: { type: integer, minimum: 1, maximum: 20, description: Questions to the person in one hand-off (default 3) }
        specialists_may_propose: { type: boolean, description: "The specialists get the proposing counterparts of their own changing tools (tracker comment, suggestion and new issue, KM2 save) as the lead always does: each makes a Confirm card; nothing changes until the person confirms (default false)" }
        agent_id: { type: string, format: uuid, readOnly: true }
        updated_by_name: { type: string, readOnly: true }
        updated_at: { type: [string, "null"], format: date-time, readOnly: true }
        hidden_specialists: { type: integer, readOnly: true, description: "Specialists outside your areas, left out of specialist_ids; saving keeps them where they are" }
        hidden_crews: { type: integer, readOnly: true, description: "Crews outside your areas, left out of crew_ids; saving keeps them where they are" }
        hidden_connections: { type: integer, readOnly: true, description: "Connections outside your areas, left out of connection_ids; saving keeps them where they are" }
    EscalationSettings:
      type: object
      properties:
        enabled: { type: boolean }
        rules: { type: string, maxLength: 4000, description: When to ask a person, in plain language; required when enabled }
        timeout_minutes: { type: integer, minimum: 1, maximum: 180, description: How long a question waits for an answer (default 30) }
        on_timeout: { type: string, enum: [proceed, fail], description: "proceed: the agent carries on and states its assumption; fail: the run stops" }
        max_questions: { type: integer, minimum: 1, maximum: 20, description: Questions one run may ask (default 5) }
        crew_id: { type: string, format: uuid, readOnly: true }
        updated_by_name: { type: string, readOnly: true }
        updated_at: { type: [string, "null"], format: date-time, readOnly: true }
    HumanQuestion:
      type: object
      properties:
        id: { type: string, format: uuid }
        run_id: { type: string, format: uuid }
        work_order_id: { type: [string, "null"], format: uuid }
        work_order_number: { type: [integer, "null"] }
        work_order_title: { type: string }
        crew_name: { type: string }
        assignee_id: { type: [string, "null"], format: uuid, description: The person asked; null when the run was not started by a person }
        agent_role: { type: string }
        asked_for: { type: string, description: "The agent the question was asked for: in a hand-off the lead asks on behalf of a specialist (asked by asked_for through agent_role); empty otherwise" }
        task_name: { type: string }
        question: { type: string }
        context: { type: string }
        status: { type: string, enum: [open, answered, timed_out, closed] }
        answer: { type: string }
        answered_by_name: { type: string }
        asked_at: { type: string, format: date-time }
        deadline_at: { type: string, format: date-time }
        answered_at: { type: [string, "null"], format: date-time }
        conversation_id: { type: [string, "null"], format: uuid, description: "Set for a question from an agent chat's hand-off: answer it in that conversation" }
        conversation_title: { type: string }
        handoff_id: { type: [string, "null"], format: uuid }
        handoff_title: { type: string }
    MemorySettings:
      type: object
      properties:
        mode: { type: string, enum: ["off", recall_only, explicit, automatic], description: "off; recall_only (runs read memories); explicit (agents save with the Remember tool, no LLM call); automatic (memories extracted after each task, one LLM call per task)" }
        llm_id: { type: [string, "null"], format: uuid, description: "The model for automatic extraction and deep recall; null uses the crew's cheapest priced agent model (resolved when a run starts). Must have a price." }
        recall_depth: { type: string, enum: [shallow, deep], description: "shallow: one embedding and a vector scan per task; deep: CrewAI's LLM-driven recall" }
        recall_limit: { type: integer, minimum: 1, maximum: 20, default: 5 }
        saves_per_run: { type: integer, minimum: 0, maximum: 100, default: 20 }
        retention_days: { type: [integer, "null"], minimum: 1, maximum: 3650, default: 365, description: Unpinned memories older than this are deleted; null keeps them }
        review_run_saves: { type: boolean, default: true, description: "Every memory a run saves (the Remember tool, automatic extraction) waits as pending (not recalled) until a person approves it; unapproved ones are deleted after 30 days. On by default because text a crew reads can plant instructions. Memories people add are active at once." }
        recency_weight: { type: number, minimum: 0, maximum: 1, default: 0.3 }
        semantic_weight: { type: number, minimum: 0, maximum: 1, default: 0.5 }
        importance_weight: { type: number, minimum: 0, maximum: 1, default: 0.2 }
        recency_half_life_days: { type: integer, minimum: 1, maximum: 3650, default: 30 }
        crew_id: { type: string, format: uuid, readOnly: true }
        updated_by_name: { type: string, readOnly: true }
        updated_at: { type: [string, "null"], format: date-time, readOnly: true }
    MemorySettingsView:
      type: object
      properties:
        settings: { $ref: "#/components/schemas/MemorySettings" }
        available: { type: boolean, description: False when the server cannot embed; memory can then only be off }
        unavailable_reason: { type: string }
        embed_model: { type: string, examples: ["text-embedding-3-small:768"] }
        suggested_llm_id: { type: [string, "null"], format: uuid, description: "The crew's cheapest priced agent model, used when llm_id is null" }
        reembed_pending: { type: integer, minimum: 0, description: "The crew's memories still embedded with an older model; they are re-embedded in the background and recall cannot find them until then" }
    MemoryRecord:
      type: object
      properties:
        id: { type: string, format: uuid }
        content: { type: string, maxLength: 2000 }
        scope: { type: string, examples: ["/", "/people/sam"] }
        categories: { type: array, items: { type: string } }
        metadata: { type: object }
        importance: { type: number, minimum: 0, maximum: 1 }
        source: { type: string, description: "run:<run id> or user:<name>" }
        private: { type: boolean, const: false }
        pinned: { type: boolean, description: Pinned memories are kept past the retention period }
        status: { type: string, enum: [active, pending] }
        run_id: { type: [string, "null"], format: uuid }
        agent_role: { type: string }
        task_name: { type: string }
        written_by: { type: string }
        created_at: { type: string, format: date-time }
        last_accessed: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        km2_document_id: { type: [string, "null"] }
    ChatMessage:
      type: object
      properties:
        id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        role: { type: string, enum: [user, assistant, summary], description: "summary: a compaction; later turns are given it instead of the messages before it" }
        content: { type: string, description: Empty for a reply whose run has not succeeded (yet) }
        proposal: { type: [object, "null"], properties: { type: { type: string, enum: [start_work_order, notes_put, tracking_add, tracking_remove, start_handoff, tracker_comment, tracker_suggestion, tracker_issue, km2_save] }, summary: { type: string }, payload: { type: object } } }
        proposal_state: { type: [string, "null"], enum: [pending, confirmed, declined, expired, null] }
        proposed_at: { type: [string, "null"], format: date-time, description: The proposal expires 24 hours later }
        proposal_result: { type: [object, "null"], description: "What applying it did: { work_order_id, work_order_number, run_id }, { name, subject, version, previous_version, undoable }, for start_handoff { handoff_id, run_id, message_id }, for tracker_comment and tracker_suggestion { connection, issue, comment_id, url }, for tracker_issue { connection, issue, url }, for km2_save { connection, document_id, outcome, external_ref, folder_id }" }
        decided_by_name: { type: string }
        decided_at: { type: [string, "null"], format: date-time }
        undone_at: { type: [string, "null"], format: date-time }
        run_id: { type: [string, "null"], format: uuid }
        run_kind: { type: string, enum: [chat, handoff], description: "The kind of the run writing an assistant message: chat for a reply, handoff for a hand-off's result; left out without a run" }
        handoff_proposal: { type: boolean, description: "A card a hand-off proposed while it worked (handoff is set, run_id is null, content is the card's summary); left out otherwise" }
        handoff: { type: object, description: "Set on a hand-off's messages: its result, and the cards it proposed", properties: { id: { type: string, format: uuid }, title: { type: string }, worker_name: { type: string }, worker_role: { type: string }, deadline_at: { type: string, format: date-time }, budget_usd: { type: number }, timeout_minutes: { type: integer }, started_at: { type: [string, "null"], format: date-time }, open_question_id: { type: [string, "null"], format: uuid, description: The question its run is waiting on you to answer } } }
        run_status: { oneOf: [{ $ref: "#/components/schemas/RunStatus" }, { type: "null" }] }
        run_error: { type: string, description: First line of why the reply failed }
        cost_usd: { type: [number, "null"] }
        created_at: { type: string, format: date-time }
    ConversationView:
      type: object
      properties:
        conversation: { type: object, properties: { id: { type: string }, crew_id: { type: [string, "null"], description: Null for a conversation with an agent }, crew_name: { type: string }, agent_id: { type: [string, "null"], description: Set for a conversation with an agent }, agent_name: { type: string }, user_id: { type: string }, title: { type: string }, created_at: { type: string }, updated_at: { type: string } } }
        messages: { type: array, items: { $ref: "#/components/schemas/ChatMessage" } }
        budget: { type: object, properties: { daily_budget_usd: { type: number }, spent_last_24h_usd: { type: number }, person_daily_budget_usd: { type: number }, person_spent_last_24h_usd: { type: number }, remaining_usd: { type: number } } }
        chat_enabled: { type: boolean }
        handoffs: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/Handoff" }, description: "The conversation's latest hand-offs, newest first (empty with a crew)" }
        questions: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/HumanQuestion" }, description: "The open questions its hand-offs are waiting on you to answer, soonest due first (empty with a crew)" }
    Handoff:
      type: object
      description: A hand-off from an agent chat, worked in the background; its result is the message result_message_id
      properties:
        id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        request_message_id: { type: [string, "null"], format: uuid, description: The reply whose card started it }
        result_message_id: { type: string, format: uuid }
        run_id: { type: [string, "null"], format: uuid, description: Null once the run was deleted }
        worker_agent_id: { type: [string, "null"], format: uuid }
        worker_name: { type: string }
        worker_role: { type: string }
        title: { type: string }
        brief: { type: string }
        budget_usd: { type: number }
        timeout_minutes: { type: integer, minimum: 1, maximum: 180 }
        deadline_at: { type: string, format: date-time, description: "timeout_minutes after the run started (after it was made, while it waits for a slot)" }
        created_at: { type: string, format: date-time }
        run_status: { oneOf: [{ $ref: "#/components/schemas/RunStatus" }, { type: "null" }], description: Null once the run was deleted; the hand-off and its result are kept }
        run_error: { type: string }
        cost_usd: { type: [number, "null"] }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        open_question_id: { type: [string, "null"], format: uuid, description: "The question its run is waiting on you to answer, if any" }
    NewAPIKey:
      type: object
      required: [name]
      description: >-
        Limits are optional. Left out, a key works on both channels with everything its account holds. A key may be
        given only permissions and areas its account holds (422 otherwise), and on every request it gets only what
        both the key and the account allow, so taking access from the account takes it from its keys too.
      properties:
        name: { type: string, maxLength: 120 }
        expires_at: { type: [string, "null"], format: date-time }
        allow_api: { type: boolean, default: true, description: "Works on the REST API (/api)" }
        allow_mcp: { type: boolean, default: true, description: "Works on the MCP endpoint (/mcp); at least one of the two" }
        permissions: { type: [array, "null"], minItems: 1, items: { type: string }, description: "Some of the account's permissions; null or left out for all of them" }
        area_ids: { type: [array, "null"], minItems: 1, items: { type: string, format: uuid }, description: "Some of the account's functional areas; null or left out for all of them" }
    Entity:
      type: object
      additionalProperties: true
      description: See studio/docs/api.md for every field.
    Agent:
      type: object
      required: [name, role, goal, backstory, max_iter, area_ids]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string }
        role: { type: string }
        goal: { type: string }
        backstory: { type: string }
        llm_id: { type: [string, "null"], format: uuid }
        tools: { type: array, items: { type: string } }
        max_iter: { type: integer, minimum: 1, maximum: 100 }
        allow_delegation: { type: boolean }
        verbose: { type: boolean }
        area_ids: { type: array, items: { type: string, format: uuid }, minItems: 1 }
    Task:
      type: object
      required: [name, description, expected_output, area_ids]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string }
        description: { type: string }
        expected_output: { type: string }
        agent_id: { type: [string, "null"], format: uuid }
        context_task_ids: { type: array, items: { type: string, format: uuid } }
        markdown: { type: boolean }
        area_ids: { type: array, items: { type: string, format: uuid }, minItems: 1 }
    Crew:
      type: object
      required: [name, process, budget_usd, area_ids]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string }
        description: { type: string }
        process: { type: string, enum: [sequential, hierarchical] }
        manager_llm_id: { type: [string, "null"], format: uuid }
        agent_ids: { type: array, items: { type: string, format: uuid } }
        task_ids: { type: array, items: { type: string, format: uuid } }
        inputs:
          type: array
          items:
            type: object
            properties: { key: { type: string }, label: { type: string }, default: { type: string }, required: { type: boolean } }
        budget_usd: { type: number }
        area_ids: { type: array, items: { type: string, format: uuid }, minItems: 1 }
    Schedule:
      type: object
      required: [name, crew_id, cron]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string }
        description: { type: string }
        crew_id: { type: string, format: uuid, description: "The crew it runs; to run one task, make a crew with just that task" }
        cron: { type: string, examples: ["0 9 * * 1-5", "@daily"] }
        timezone: { type: string, examples: [Europe/London] }
        brief: { type: string }
        inputs: { type: object, additionalProperties: { type: string } }
        budget_usd: { type: [number, "null"] }
        enabled: { type: boolean }
        overlap_policy: { type: string, enum: [skip, allow] }
        next_run_at: { type: [string, "null"], format: date-time, readOnly: true }
    Trigger:
      type: object
      required: [name, crew_id]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string }
        description: { type: string }
        crew_id: { type: string, format: uuid, description: "The crew it runs; to run one task, make a crew with just that task" }
        enabled: { type: boolean }
        input_map: { type: object, additionalProperties: { type: string }, examples: [{ company: customer.name }] }
        brief: { type: string }
        include_payload: { type: boolean }
        budget_usd: { type: [number, "null"] }
        callback_url: { type: [string, "null"], format: uri }
        token: { type: string, readOnly: true, description: Only in the create and rotate responses }
    UserInput:
      type: object
      required: [kind, name]
      properties:
        kind: { type: string, enum: [human, service] }
        email: { type: string, format: email }
        name: { type: string }
        status: { type: string, enum: [active, disabled] }
        all_areas: { type: boolean }
        area_ids: { type: array, items: { type: string, format: uuid } }
        role_ids: { type: array, items: { type: string, format: uuid } }
        permissions: { type: array, items: { type: string } }
    Role:
      type: object
      required: [name, permissions]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string }
        description: { type: string }
        permissions: { type: array, items: { type: string } }
    Area:
      type: object
      required: [name]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string }
        description: { type: string }
    WorkOrderInput:
      type: object
      required: [title, crew_id]
      properties:
        title: { type: string, maxLength: 200 }
        brief: { type: string, maxLength: 100000, description: Markdown instructions given to every task }
        crew_id: { type: string, format: uuid, description: "The crew to run; to run one task, make a crew with just that task (GET /tasks/{id}/crew-draft)" }
        inputs: { type: object, additionalProperties: { type: string } }
        budget_usd: { type: [number, "null"], exclusiveMinimum: 0, maximum: 1000 }
        submit: { type: boolean, description: Start it straight away }
        callback_url: { type: string, format: uri, description: "POSTed (signed) when the run finishes; service accounts only" }
    WorkOrder:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: integer, description: Shown as WO-<number> }
        title: { type: string }
        brief: { type: string }
        crew_id: { type: [string, "null"], format: uuid, description: "Null once the crew is deleted; target_name keeps its name" }
        target_name: { type: string }
        status: { type: string, enum: [draft, queued, running, succeeded, failed, cancelled] }
        current_run_id: { type: [string, "null"], format: uuid }
        cost_usd: { type: [number, "null"] }
        source: { type: string, enum: [manual, api, schedule, webhook] }
        created_at: { type: string, format: date-time }
        attachments: { type: array, items: { $ref: "#/components/schemas/Attachment" } }
        runs: { type: array, items: { $ref: "#/components/schemas/Run" } }
    Attachment:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [input, artifact, transcript] }
        filename: { type: string }
        content_type: { type: string }
        size_bytes: { type: integer }
        sha256: { type: string }
        created_at: { type: string, format: date-time }
    Journal:
      type: object
      properties:
        run_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/RunStatus" }
        agents: { type: array, items: { type: object } }
        tasks: { type: array, items: { type: object } }
        entries:
          type: array
          items:
            type: object
            properties:
              seq: { type: integer }
              at: { type: string, format: date-time }
              agent_role: { type: string }
              task_name: { type: string }
              kind: { type: string }
              title: { type: string }
              body: { type: string }
              cost_usd: { type: number }
        truncated: { type: boolean }
    HookAccepted:
      type: object
      properties:
        work_order_id: { type: string, format: uuid }
        number: { type: integer }
        run_id: { type: string, format: uuid }
        status: { type: string }
        status_url: { type: string }
    CallbackPayload:
      type: object
      description: |
        Sent to callback URLs. Verify X-CrewStudio-Signature: "sha256=" + hex(HMAC-SHA256(secret,
        "<X-CrewStudio-Timestamp>.<raw body>")), and reject timestamps older than 5 minutes.
      properties:
        event: { const: run.finished }
        delivered_at: { type: string, format: date-time }
        run: { $ref: "#/components/schemas/Run" }
        work_order:
          type: [object, "null"]
          properties:
            id: { type: string, format: uuid }
            number: { type: integer }
            title: { type: string }
    Connection:
      type: object
      description: A connection as returned by the API. Secret values are never included; secret_keys lists which are set.
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string }
        kind: { type: string, enum: [jira, linear, km2_tracker, km2, http, mcp, slack, teams, email] }
        config: { type: object, additionalProperties: { type: string }, description: "Non-secret settings, such as site_url; see GET /connections/kinds" }
        secret_keys: { type: array, items: { type: string }, readOnly: true }
        missing_secrets: { type: array, items: { type: string }, readOnly: true }
        secret_updated_at: { type: [string, "null"], format: date-time, readOnly: true }
        area_ids: { type: array, items: { type: string, format: uuid }, minItems: 1 }
        enabled: { type: boolean }
        crew_count: { type: integer, readOnly: true }
    ConnectionInput:
      type: object
      required: [name, kind, area_ids]
      properties:
        name: { type: string }
        kind: { type: string, enum: [jira, linear, km2_tracker, km2, http, mcp, slack, teams, email], description: "Cannot change after creation. mcp is an outside MCP server (Streamable HTTP; config url and auth_header, secret auth_value) whose reading tools agents may use in chat; not Studio's own MCP endpoint" }
        config: { type: object, additionalProperties: { type: string } }
        area_ids: { type: array, items: { type: string, format: uuid }, minItems: 1 }
        enabled: { type: boolean, default: true }
        secrets: { type: object, additionalProperties: { type: string, format: password }, description: "Only when creating; later use PUT /connections/{id}/secret" }
    ConnectionTool:
      type: object
      description: "A tool of an MCP connection, as Discover tools last found it. name, description and input_schema are the MCP server's own words (untrusted)."
      properties:
        connection_id: { type: string, format: uuid }
        name: { type: string, pattern: "^[A-Za-z0-9_.-]{1,128}$" }
        description: { type: string, maxLength: 4000 }
        input_schema: { type: object, description: "The tool's JSON Schema for its arguments (at most 16 KB)" }
        effect: { type: string, enum: [reads, changes], description: "From the server's readOnlyHint on discovery; agent chat uses only enabled tools that read" }
        enabled: { type: boolean }
        discovered_at: { type: string, format: date-time }
        updated_by_name: { type: string }
        updated_at: { type: string, format: date-time }
    NoteVersion:
      type: object
      properties:
        id: { type: string, format: uuid }
        schedule_id: { type: [string, "null"], format: uuid, description: "null: crew-wide" }
        subject: { type: string, examples: ["project:atlas"] }
        name: { type: string, examples: [weekly-report] }
        version: { type: integer }
        content: { type: string, maxLength: 65536 }
        run_id: { type: [string, "null"], format: uuid }
        written_by: { type: string, description: "run, or the name of the person who edited it" }
        created_at: { type: string, format: date-time }
    NotePut:
      type: object
      required: [content]
      properties:
        subject: { type: string, maxLength: 200 }
        content: { type: string, description: At most 64 KB }
        expected_version: { type: integer, minimum: 0, description: "Refuse the write (409 version_conflict) unless the note is at this version; 0 means it must not exist yet" }
    ActionEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        schedule_id: { type: [string, "null"], format: uuid }
        schedule_name: { type: string }
        subject: { type: string, examples: ["jira:PRJ-15"] }
        action: { type: string, examples: ["followup:due_soon"] }
        run_id: { type: [string, "null"], format: uuid }
        dry_run: { type: boolean }
        details: { type: object }
        idempotency_key: { type: [string, "null"] }
        at: { type: string, format: date-time }
    LogRecord:
      type: object
      required: [subject, action]
      properties:
        subject: { type: string, maxLength: 200 }
        action: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._:/-]{0,99}$" }
        details: { type: object, description: At most 16 KB as JSON }
        idempotency_key: { type: string, maxLength: 200, description: Recording the same key twice for a crew adds nothing }
    WatchSource:
      type: object
      required: [kind]
      description: Where a watch reads its items. Fields apply per kind.
      properties:
        kind: { type: string, enum: [http_json, web_page, workspace_file, tracker, tracking_list] }
        path: { type: string, description: "http_json: path and query added to the connection's base URL, such as /issues?state=open" }
        items_path: { type: string, description: "http_json and JSON files: dotted path to the array of items; empty for a top-level array" }
        url: { type: string, description: "web_page: a public http(s) page" }
        selector: { type: string, description: "web_page: optional CSS selector; only the matching text is compared" }
        file: { type: string, description: "workspace_file: a path in the Studio workspace's watch/ folder" }
        format: { type: string, enum: [csv, json], description: "workspace_file: default from the file's extension" }
        project: { type: string, description: "tracker: the Jira project key or Linear team key, such as PRJ" }
        jql: { type: string, maxLength: 1000, description: "tracker, Jira only: an extra JQL clause ANDed in (no ORDER BY)" }
        include_done: { type: boolean, description: "tracker: also done and canceled issues" }
        lead: { type: string, description: "tracker: who 'lead' follow-ups notify instead of the project lead (a tracker account id)" }
        comments: { type: boolean, description: "tracker and tracking_list: also report new comments (500 characters each, 50 per check; the connection's own comments are left out)" }
        stale_days: { type: integer, minimum: 1, maximum: 365, default: 14, description: "tracker and tracking_list: an open child with no update for this long is stale in roll-ups" }
    FollowupLadder:
      type: object
      required: [date_field, steps]
      properties:
        date_field: { type: string, description: One of the tracked fields }
        skip_when: { type: object, additionalProperties: { type: array, items: { type: string } }, description: "Tracked field to values (ignoring case) that leave an item out, such as {status: [Done]}" }
        steps:
          type: array
          maxItems: 20
          items:
            type: object
            required: [name, offset, notify]
            properties:
              name: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,49}$", examples: [due_soon] }
              offset: { type: string, examples: ["-3d", "0d", "+2d", "1w"] }
              notify: { type: string, description: "owner, lead, or a tracked field holding the person" }
              repeat: { type: string, examples: [7d], description: Due again once this long has passed since it was last recorded }
        quiet_days: { type: array, items: { type: string, enum: [Mon, Tue, Wed, Thu, Fri, Sat, Sun] } }
        timezone: { type: string, description: "Empty: the schedule's time zone" }
        max_per_tick: { type: integer, minimum: 1, maximum: 200, default: 25 }
    WatchInput:
      type: object
      required: [source]
      properties:
        connection_id: { type: [string, "null"], format: uuid, description: "http_json: an enabled http connection the crew may use; tracker: a Jira or Linear one. tracking_list reads each tracked item's own connection." }
        source: { $ref: "#/components/schemas/WatchSource" }
        id_field: { type: string, description: "Dotted path (or CSV column) identifying each item; ignored for web pages; always key for trackers (items are jira:PRJ-15)" }
        tracked_fields: { type: array, items: { type: string }, maxItems: 30, description: "Fields to compare; ignored for web pages (their text is compared). Trackers: title, status, status_category, assignee, due_date, priority, updated_at, parent, labels (default status, assignee, due_date, priority)" }
        run_when: { type: string, enum: [changed, always, changed_or_followups], default: changed }
        followups: { oneOf: [{ $ref: "#/components/schemas/FollowupLadder" }, { type: "null" }] }
        dry_run: { type: boolean, default: true }
        max_items: { type: integer, minimum: 1, maximum: 10000, default: 2000, description: More items than this fail the check instead of being cut }
        mention_cap_per_day: { type: integer, minimum: 1, maximum: 50, default: 3, description: "Tracker tools: how often the crew may mention one person in 24 hours" }
        comment_cap_per_run: { type: integer, minimum: 1, maximum: 500, default: 30, description: "Tracker tools: how many comments one run may post" }
    Watch:
      allOf:
        - { $ref: "#/components/schemas/WatchInput" }
        - type: object
          properties:
            id: { type: string, format: uuid }
            schedule_id: { type: string, format: uuid }
            schedule_name: { type: string }
            crew_id: { type: [string, "null"], format: uuid }
            connection_name: { type: string }
            last_checked_at: { type: [string, "null"], format: date-time }
            last_changed_at: { type: [string, "null"], format: date-time }
            last_error: { type: [string, "null"] }
            snapshot_at: { type: [string, "null"], format: date-time, description: "null: the next check is the first" }
            snapshot_items: { type: integer }
    WatchView:
      type: object
      properties:
        watch: { oneOf: [{ $ref: "#/components/schemas/Watch" }, { type: "null" }] }
        stats:
          type: [object, "null"]
          description: Last 30 days
          properties:
            days: { type: integer }
            checks: { type: integer }
            runs_started: { type: integer }
            runs_skipped: { type: integer }
            avg_run_tokens: { type: integer }
            est_tokens_saved: { type: integer }
            est_cost_saved_usd: { type: number }
        checks:
          type: array
          description: The 20 most recent checks, newest first
          items:
            type: object
            properties:
              checked_at: { type: string, format: date-time }
              outcome: { type: string, enum: [started, no_changes, busy, error] }
              added: { type: integer }
              changed: { type: integer }
              removed: { type: integer }
              unchanged: { type: integer }
              followups_due: { type: integer }
              work_order_id: { type: [string, "null"], format: uuid }
              message: { type: string }
        source_kinds: { type: array, items: { type: object } }
        connections: { type: array, description: "Connections the crew may use for a watch (schedules.manage only)", items: { type: object } }
    WatchPreview:
      type: object
      description: What a check would see now. Nothing is saved or started.
      properties:
        changes: { type: object, description: "{ source, checked_at, previous_check_at, added, changed, removed, new_comments, new_comments_omitted, unchanged_count }" }
        followups_due: { type: [object, "null"], description: "{ due: [...], more_waiting, dry_run, how_to_record }; tracker items' steps name notify_person { account_id, name, studio_user }" }
        rollups: { type: object, description: "tracking_list only: { items: [{ item, title, project, connection, due_date, children: { total, done, in_progress, to_do, canceled }, overdue, due_after_parent, blocked, unassigned, stale, new_comments, changed_since_last_check }], stale_days }. Runs get only the changed items as the rollups input." }
        would_run: { type: boolean }
        reason: { type: string }
        item_count: { type: integer }
        sample: { type: array, items: { type: object }, description: Up to 5 items as fetched }
paths:
  /auth/me:
    get:
      tags: [Sign-in]
      summary: Who the key belongs to, with its permissions and functional areas
      responses:
        "200": { description: The principal }
        "401": { $ref: "#/components/responses/Error" }
  /account/api-keys:
    get:
      tags: [Account]
      summary: Your API keys, active first then newest (the secrets are never returned again)
      parameters:
        - { $ref: "#/components/parameters/limit" }
        - { $ref: "#/components/parameters/offset" }
        - { name: q, in: query, schema: { type: string, maxLength: 200 }, description: "Matches key name, account name or prefix" }
        - { name: kind, in: query, schema: { type: string, enum: [human, service] } }
        - { name: status, in: query, schema: { type: string, enum: [active, expired, revoked] } }
      responses: { "200": { description: "Page of keys (with meta: total, limit, offset)" } }
    post:
      tags: [Account]
      summary: Create a key that acts as you (account.api_keys; the secret is shown once)
      description: >-
        Needs a signed-in session: a request made with an API key is refused, so a key cannot create more keys.
        An account holds at most 20 active keys.
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/NewAPIKey" } } } }
      responses:
        "201": { description: "{ key, secret }" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /account/api-keys/{keyId}:
    delete:
      tags: [Account]
      summary: Revoke one of your keys
      parameters: [{ name: keyId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "204": { description: Revoked }, "404": { $ref: "#/components/responses/Error" } }
  /crews/{id}/runs:
    post:
      tags: [Crews]
      summary: Run a crew directly (crews.run)
      parameters: [{ $ref: "#/components/parameters/id" }, { $ref: "#/components/parameters/idempotencyKey" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                inputs: { type: object, additionalProperties: { type: string } }
                budget_usd: { type: number }
                callback_url: { type: string, format: uri }
      responses:
        "201": { description: Queued run, content: { application/json: { schema: { $ref: "#/components/schemas/Run" } } } }
        "200": { description: Earlier run with the same Idempotency-Key }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /work-orders:
    get:
      tags: [Work orders]
      summary: List work orders (work_orders.view)
      parameters:
        - { $ref: "#/components/parameters/limit" }
        - { $ref: "#/components/parameters/offset" }
        - { name: status, in: query, schema: { type: string } }
        - { name: source, in: query, schema: { type: string } }
        - { name: crew_id, in: query, schema: { type: string, format: uuid } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        "200": { description: Page of work orders }
    post:
      tags: [Work orders]
      summary: Create (and optionally submit) a work order (work_orders.create)
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkOrderInput" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/WorkOrder" } } } }
        "422": { $ref: "#/components/responses/Error" }
  /work-orders/{id}:
    get:
      tags: [Work orders]
      summary: A work order with its input files and every attempt
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { description: Work order, content: { application/json: { schema: { $ref: "#/components/schemas/WorkOrder" } } } }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [Work orders]
      summary: Edit a work order (not while queued or running); applies to the next submit
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/WorkOrderInput" } } } }
      responses: { "200": { description: Updated }, "409": { $ref: "#/components/responses/Error" } }
    delete:
      tags: [Work orders]
      summary: Delete with every run and file (work_orders.delete)
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses: { "204": { description: Deleted }, "409": { $ref: "#/components/responses/Error" } }
  /work-orders/{id}/attachments:
    post:
      tags: [Work orders]
      summary: Attach files (multipart, field "file"; send X-Requested-With crewstudio)
      parameters:
        - { $ref: "#/components/parameters/id" }
        - { name: X-Requested-With, in: header, required: true, schema: { const: crewstudio } }
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: array, items: { type: string, format: binary } }
      responses:
        "201": { description: Stored files }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
  /work-orders/{id}/submit:
    post:
      tags: [Work orders]
      summary: Start a new attempt (work_orders.create)
      parameters: [{ $ref: "#/components/parameters/id" }, { $ref: "#/components/parameters/idempotencyKey" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                budget_usd: { type: number }
                callback_url: { type: string, format: uri }
      responses:
        "201": { description: Queued run }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /work-orders/{id}/cancel:
    post:
      tags: [Work orders]
      summary: Stop the current attempt (work_orders.cancel)
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { description: The run }
  /work-orders/{id}/journal:
    get:
      tags: [Work orders]
      summary: What each agent did on each task
      parameters:
        - { $ref: "#/components/parameters/id" }
        - { name: run_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Journal, content: { application/json: { schema: { $ref: "#/components/schemas/Journal" } } } }
  /runs/{id}:
    get:
      tags: [Runs]
      summary: A run with its outputs and frozen spec
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { description: Run, content: { application/json: { schema: { $ref: "#/components/schemas/Run" } } } }
    delete:
      tags: [Runs]
      summary: Delete a finished run with its events and files (runs.delete)
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses: { "204": { description: Deleted }, "409": { $ref: "#/components/responses/Error" } }
  /runs/{id}/events:
    get:
      tags: [Runs]
      summary: Run events after a sequence number (poll), or use /runs/{id}/stream for Server-Sent Events
      parameters:
        - { $ref: "#/components/parameters/id" }
        - { name: after, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        "200": { description: Events }
  /runs/{id}/artifacts:
    get:
      tags: [Runs]
      summary: Files the agents wrote, plus the full transcript and console log
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { description: Files, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Attachment" } } } } }
  /attachments/{id}/content:
    get:
      tags: [Work orders]
      summary: Download a stored file
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
