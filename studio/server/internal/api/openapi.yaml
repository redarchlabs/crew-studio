      tags: [Schedules]
      summary: "Where the reports of this schedule's runs go besides the work order (schedules.view). connections lists the slack, teams, email and km2 connections the crew may use that share an area with the schedule (only for schedules.manage)."
      responses: { "200": { description: "{ destinations: [ReportDestination], connections: [{ id, name, kind }], kinds: [slack, teams, email, km2] }" }, "404": { $ref: "#/components/responses/Error" } }
    put:
      tags: [Schedules]
      summary: "Replace the destinations (schedules.manage). At most 10; each needs a connection of its kind that the caller can see, the crew may use (its State tab) and that shares an area with the schedule. Email destinations list 1 to 50 bare addresses; KM2 destinations may name a folder id the connection allows. A connection a destination uses cannot be deleted (409)."
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [destinations], properties: { destinations: { type: array, maxItems: 10, items: { type: object, required: [kind, connection_id], properties: { kind: { type: string, enum: [slack, teams, email, km2] }, connection_id: { type: string, format: uuid }, recipients: { type: array, maxItems: 50, items: { type: string, format: email } }, folder: { type: string } } } } } } } } }
      responses: { "200": { description: The destinations view }, "422": { $ref: "#/components/responses/Error" } }
