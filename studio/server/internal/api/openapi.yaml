      summary: People (kind=human) or service accounts (kind=service)
      parameters: [{ name: kind, in: query, schema: { type: string, enum: [human, service] } }]
      responses: { "200": { description: Users } }
    post:
      tags: [Admin]
      summary: Invite a person or create a service account
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/UserInput" } } } }
      responses: { "201": { description: Created }, "422": { $ref: "#/components/responses/Error" } }
  /admin/users/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [Admin]
      summary: One person or service account
      responses: { "200": { description: User } }
    put:
      tags: [Admin]
      summary: Change roles, areas, permissions or status
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/UserInput" } } } }
      responses: { "200": { description: Updated }, "403": { $ref: "#/components/responses/Error" }, "409": { $ref: "#/components/responses/Error" } }
    delete:
      tags: [Admin]
      summary: Delete
      responses: { "204": { description: Deleted } }
  /admin/api-keys:
    get:
      tags: [Admin]
      summary: Every API key, with its account (people's keys need admin.users, service accounts' need admin.service_accounts)
      parameters:
        - { $ref: "#/components/parameters/limit" }
        - { $ref: "#/components/parameters/offset" }
        - { name: q, in: query, schema: { type: string, maxLength: 200 }, description: "Matches key name, account name or prefix" }
        - { name: kind, in: query, schema: { type: string, enum: [human, service] } }
        - { name: status, in: query, schema: { type: string, enum: [active, expired, revoked] } }
      responses:
        "200": { description: "Page of keys with user_name, user_kind, created_by_name and can_revoke (false when the owner holds something you do not)" }
        "422": { $ref: "#/components/responses/Error" }
  /admin/users/{id}/api-keys:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [Admin]
      summary: A person's or service account's API keys
      parameters:
        - { $ref: "#/components/parameters/limit" }
        - { $ref: "#/components/parameters/offset" }
        - { name: q, in: query, schema: { type: string, maxLength: 200 }, description: "Matches key name, account name or prefix" }
        - { name: kind, in: query, schema: { type: string, enum: [human, service] } }
        - { name: status, in: query, schema: { type: string, enum: [active, expired, revoked] } }
      responses: { "200": { description: Page of keys with can_revoke } }
    post:
      tags: [Admin]
      summary: Issue a service account an API key (the secret is shown once; people create their own)
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/NewAPIKey" } } } }
      responses: { "201": { description: "{ key, secret }" } }
  /admin/access:
    get:
      tags: [Admin]
      summary: Sign-in settings (auto-provisioning, callback host allow-list)
      responses: { "200": { description: Settings } }
    put:
      tags: [Admin]
      summary: Change sign-in settings (admin.access)
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/Entity" } } } }
      responses: { "200": { description: Settings } }
  /admin/audit:
    get:
      tags: [Admin]
      summary: Sign-ins, sign-in failures, and API keys created, revoked or refused (secrets are never recorded)
      parameters: [{ $ref: "#/components/parameters/limit" }, { $ref: "#/components/parameters/offset" }]
      responses: { "200": { description: Page of events } }
  /admin/users/{id}/password:
    parameters: [{ $ref: "#/components/parameters/id" }]
    put:
      tags: [Admin]
      summary: Set an administrator's local password (12-72 characters)
      requestBody: { content: { application/json: { schema: { type: object, properties: { password: { type: string, format: password } } } } } }
      responses: { "204": { description: Set }, "403": { $ref: "#/components/responses/Error" } }
    delete:
      tags: [Admin]
      summary: Remove the local password
      responses: { "204": { description: Removed } }
  /admin/users/{id}/sessions/revoke:
    post:
      tags: [Admin]
      summary: Sign someone out everywhere
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses: { "200": { description: "{ ended }" } }
  /admin/users/{id}/api-keys/{keyId}:
    delete:
      tags: [Admin]
      summary: Revoke a person's or service account's API key
      parameters:
        - { $ref: "#/components/parameters/id" }
        - { name: keyId, in: path, required: true, schema: { type: string, format: uuid } }
      responses: { "204": { description: Revoked } }
  /admin/users/{id}/signing-secret:
    get:
      tags: [Admin]
      summary: The service account's callback signing secret
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses: { "200": { description: "{ signing_secret }" } }
  /admin/users/{id}/signing-secret/rotate:
    post:
      tags: [Admin]
      summary: Replace the signing secret
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses: { "200": { description: "{ signing_secret }" } }
  /pmo/setup:
    get:
      tags: [Crews]
      summary: "What the PMO setup wizard offers (crews.create, crews.edit, agents.create, tasks.create, schedules.manage, work_orders.create and connections.view): enabled Jira and Linear connections (trackers) and slack, teams, email and km2 connections (destinations) the caller can see, with their areas; every LLM; the template agents' LLMs as suggestions; the two cron expressions. 409 pmo_template_missing without the PMO template (migration 0016)."
      responses: { "200": { description: "{ trackers, destinations, llms: [{ id, name, kind, area_ids? }], coordinator_llm_id, reporter_llm_id, sweep_cron, report_cron, ladder }" }, "403": { $ref: "#/components/responses/Error" }, "409": { $ref: "#/components/responses/Error" } }
    post:
      tags: [Crews]
      summary: "Set up a PMO in one transaction (same permissions): copies the PMO template's two agents and tasks into area_ids (named after name), makes the crew with the tracker and destination connections and chat on (the coordinator is the front desk), and two schedules running as the caller in timezone: <name>: daily sweep (0 7 * * 1-5; tracking_list watch, changed_or_followups, the default follow-up ladder, dry run on) and <name>: weekly report (0 8 * * 1; run always, dry run on, the report destinations). Each schedule's run_tasks input names its task. A name already in use fails the whole setup (409). Audited as pmo_installed."
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [area_ids, tracker_connection_id, timezone], properties: { name: { type: string, maxLength: 80, default: PMO }, area_ids: { type: array, items: { type: string, format: uuid } }, tracker_connection_id: { type: string, format: uuid }, timezone: { type: string, example: America/Denver }, coordinator_llm_id: { type: string, nullable: true }, reporter_llm_id: { type: string, nullable: true }, destinations: { type: array, items: { type: object } }, enabled: { type: boolean, default: true } } } } } }
      responses: { "201": { description: "{ crew, agents, tasks, schedules }" }, "409": { $ref: "#/components/responses/Error" }, "422": { $ref: "#/components/responses/Error" } }
  /connections:
    get:
      tags: [Connections]
      summary: Connections in your areas (connections.view); never their secrets
      responses: { "200": { description: List of Connection } }
    post:
      tags: [Connections]
      summary: Create, with its secrets (connections.manage); 409 secrets_key_missing when the server has no STUDIO_SECRETS_KEY
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ConnectionInput" } } } }
      responses: { "201": { description: The Connection }, "409": { $ref: "#/components/responses/Error" }, "422": { $ref: "#/components/responses/Error" } }
  /connections/kinds:
    get:
      tags: [Connections]
      summary: The settings and secrets each kind needs, and whether the server can store secrets
      responses: { "200": { description: "{ kinds, secrets_ready }" } }
  /connections/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [Connections]
      summary: Get one
      responses: { "200": { description: The Connection }, "404": { $ref: "#/components/responses/Error" } }
    put:
      tags: [Connections]
      summary: "Change name, settings, areas and enabled (connections.manage, all of its areas). The kind stays; a new URL, host, port or auth header clears the secrets"
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ConnectionInput" } } } }
      responses: { "200": { description: Updated }, "422": { $ref: "#/components/responses/Error" } }
    delete:
      tags: [Connections]
      summary: Delete, with its secrets
      responses: { "204": { description: Deleted } }
  /connections/{id}/secret:
    put:
      tags: [Connections]
      summary: Replace every secret field (connections.manage); the values are never returned
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { secrets: { type: object, additionalProperties: { type: string, format: password } } } } } } }
      responses: { "200": { description: The Connection }, "422": { $ref: "#/components/responses/Error" } }
  /connections/{id}/test:
    post:
      tags: [Connections]
      summary: Try to reach the system. Jira and Linear report which account the credentials belong to. Slack and Teams post a test message to the channel; email sends one to the person testing (or the from address), never anyone else (6 test messages a minute per person). KM2 lists the folders the key can see (GET /api/v1/knowledge/folders, which needs knowledge:read) and warns about save folders the key cannot see. MCP connects and counts the server's tools without keeping them (Discover tools keeps them).
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses: { "200": { description: "{ supported, ok, message, status_code, duration_ms } plus, for KM2, { folders: [{ id, name, path, parent_id }] (first 200), folder_count, warnings }" }, "429": { $ref: "#/components/responses/Error" } }
  /connections/{id}/km2/folders:
    get:
      tags: [Connections]
      summary: "KM2 connections: every folder the saved key can see, with the folders the connection allows, for folder pickers (the connection in your areas, and connections.view or schedules.manage; the same budget as Test). A key without knowledge:read, or a KM2 failure, answers ok false with a message."
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses: { "200": { description: "{ ok, message, status_code, folders: [{ id, name, path, parent_id }], folder_count, allowed: { default_folder_id, write_folder_ids }, warnings }" }, "404": { $ref: "#/components/responses/Error" }, "422": { $ref: "#/components/responses/Error" }, "429": { $ref: "#/components/responses/Error" } }
  /connections/{id}/tools:
    get:
      tags: [Connections]
      summary: "MCP connections: the tools Discover tools last found, with their effects (connections.view; 422 not_mcp for other kinds)"
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses: { "200": { description: "[ConnectionTool]", content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ConnectionTool" } } } } }, "404": { $ref: "#/components/responses/Error" }, "422": { $ref: "#/components/responses/Error" } }
    put:
      tags: [Connections]
      summary: "MCP connections: set the effect (reads or changes) and enabled flag of the named tools; others stay as they are, and an unknown name refuses the whole change (connections.manage, all of the connection's areas)"
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [tools], properties: { tools: { type: array, maxItems: 200, items: { type: object, required: [name, effect, enabled], properties: { name: { type: string }, effect: { type: string, enum: [reads, changes] }, enabled: { type: boolean } } } } } } } } }
      responses: { "200": { description: "[ConnectionTool]" }, "403": { $ref: "#/components/responses/Error" }, "422": { $ref: "#/components/responses/Error" } }
  /connections/{id}/tools/discover:
    post:
      tags: [Connections]
      summary: "MCP connections: ask the server for its tools (tools/list, with the stored secret) and keep them. A tool whose description and input schema are unchanged keeps its effect and enabled flag. On the first discovery a tool takes reads when the server's readOnlyHint says so, changes otherwise; later, new and changed tools start as changes and are listed in review. Tools the server no longer lists are removed; names outside [A-Za-z0-9_.-]{1,128}, schemas over 16 KB and tools past 200 are skipped. 10 a minute per person, with Test (connections.manage, all of the connection's areas)."
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses: { "200": { description: "{ tools: [ConnectionTool], found, skipped: [string], review: [string] }" }, "403": { $ref: "#/components/responses/Error" }, "422": { $ref: "#/components/responses/Error" }, "429": { $ref: "#/components/responses/Error" }, "502": { description: "mcp_failed: the server could not be reached, refused the credentials, redirected, timed out (25 s) or answered with an error (its message, untrusted, in details)" } }
  /connections/{id}/people:
    get:
      tags: [Connections]
      summary: "Jira and Linear connections: the people map (tracker accounts and the Studio users they are linked to), with the users that can be linked (connections.view)"
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses: { "200": { description: "{ people: [TrackerPerson], users: [{ id, name, email }] }" }, "404": { $ref: "#/components/responses/Error" } }
  /connections/{id}/people/sync:
    post:
      tags: [Connections]
      summary: Read the tracker's people into the people map and link them to Studio users by email (connections.manage; in all the connection's areas)
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses: { "200": { description: "{ people, users, read, linked }" }, "502": { $ref: "#/components/responses/Error" } }
  /connections/{id}/people/{accountId}:
    put:
      tags: [Connections]
      summary: Link a tracker account to a Studio user by hand, or clear the link with null (connections.manage); a hand-made link is never changed by a sync
      parameters:
        - { $ref: "#/components/parameters/id" }
        - { name: accountId, in: path, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { user_id: { type: [string, "null"], format: uuid } } } } } }
      responses: { "200": { description: The TrackerPerson }, "404": { $ref: "#/components/responses/Error" }, "422": { $ref: "#/components/responses/Error" } }
  /crews/{id}/connections:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [Crew state]
      summary: Connections the crew's tools may use (connections.view; only those in your areas)
      responses: { "200": { description: List of Connection } }
    put:
      tags: [Crew state]
      summary: Set them (crews.edit and connections.view); links to connections outside your areas are kept
      requestBody: { content: { application/json: { schema: { type: object, properties: { connection_ids: { type: array, items: { type: string, format: uuid } } } } } } }
      responses: { "200": { description: List of Connection }, "422": { $ref: "#/components/responses/Error" } }
  /crews/{id}/state/notes:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [Crew state]
      summary: Latest version of each note, without content (state.view)
      parameters:
        - { name: schedule_id, in: query, schema: { type: string }, description: "Empty: all; none: crew-wide; or a schedule's id" }
        - { name: subject, in: query, schema: { type: string } }
      responses: { "200": { description: "List of { schedule_id, schedule_name, subject, name, version, bytes, written_by, run_id, updated_at }" } }
    put:
      tags: [Crew state]
      summary: Save a new version by hand (state.manage)
      requestBody: { content: { application/json: { schema: { type: object, properties: { schedule_id: { type: [string, "null"] }, subject: { type: string }, name: { type: string }, content: { type: string }, expected_version: { type: integer } } } } } }
      responses: { "200": { description: The NoteVersion }, "409": { $ref: "#/components/responses/Error" } }
    delete:
      tags: [Crew state]
      summary: Delete a note and all its versions (state.manage)
      parameters:
        - { name: schedule_id, in: query, schema: { type: string }, description: "A schedule's id, or none (or empty) for crew-wide" }
        - { name: subject, in: query, schema: { type: string } }
        - { name: name, in: query, required: true, schema: { type: string } }
      responses: { "204": { description: Deleted }, "404": { $ref: "#/components/responses/Error" } }
  /crews/{id}/state/notes/versions:
    get:
      tags: [Crew state]
      summary: A note's versions, newest first (at most 100)
      parameters:
        - { $ref: "#/components/parameters/id" }
        - { name: schedule_id, in: query, schema: { type: string }, description: "A schedule's id, or none (or empty) for crew-wide" }
        - { name: subject, in: query, schema: { type: string } }
        - { name: name, in: query, required: true, schema: { type: string } }
      responses: { "200": { description: List of NoteVersion } }
  /crews/{id}/state/notes/rollback:
    post:
      tags: [Crew state]
      summary: Save an earlier version's content as the newest version (state.manage)
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { schedule_id: { type: [string, "null"] }, subject: { type: string }, name: { type: string }, version: { type: integer }, expected_version: { type: integer } } } } } }
      responses: { "200": { description: The new NoteVersion }, "404": { $ref: "#/components/responses/Error" }, "409": { $ref: "#/components/responses/Error" } }
  /crews/{id}/state/log:
    get:
      tags: [Crew state]
      summary: The action log, newest first (state.view); subject and action match anywhere, ignoring case
      parameters:
        - { $ref: "#/components/parameters/id" }
        - { name: schedule_id, in: query, schema: { type: string } }
        - { name: subject, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/limit" }
        - { $ref: "#/components/parameters/offset" }
      responses: { "200": { description: Page of ActionEntry } }
  /crews/{id}/state/log/{entryId}:
    delete:
      tags: [Crew state]
      summary: Delete one entry (state.manage)
      parameters:
        - { $ref: "#/components/parameters/id" }
        - { name: entryId, in: path, required: true, schema: { type: string, format: uuid } }
      responses: { "204": { description: Deleted } }
  /crews/{id}/state/watches:
    get:
      tags: [Crew state]
      summary: Watches on the crew's schedules, with their status and 30-day savings (state.view)
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses: { "200": { description: "List of Watch, each with stats" } }
  /crews/{id}/state/tracking:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [Crew state]
      summary: The crew's tracking list (state.view), and the Jira and Linear connections it may use for new items
      parameters: [{ name: include_removed, in: query, schema: { type: boolean } }]
      responses:
        "200":
          description: "{ items: [TrackingItem], connections: [{ id, name, kind }] }"
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/TrackingItem" } }
                  connections: { type: array, items: { type: object, properties: { id: { type: string }, name: { type: string }, kind: { type: string } } } }
    post:
      tags: [Crew state]
      summary: Add an item (state.manage). The connection must be one the crew may use and the item must exist in the tracker; an empty project becomes the item's project key.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TrackingItemInput" } } } }
      responses: { "201": { description: The TrackingItem }, "409": { description: already_tracked, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }, "422": { $ref: "#/components/responses/Error" }, "502": { $ref: "#/components/responses/Error" } }
  /crews/{id}/state/tracking/check:
    post:
      tags: [Crew state]
      summary: Look an item up in the tracker before adding it, to confirm it (state.manage); saves nothing
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TrackingItemInput" } } } }
      responses: { "200": { description: "{ connection, issue, direct_children, children_capped, already_tracked }" }, "422": { $ref: "#/components/responses/Error" } }
  /crews/{id}/state/tracking/{itemId}:
    delete:
      tags: [Crew state]
      summary: Stop tracking an item (state.manage); it stays in the history
      parameters:
        - { $ref: "#/components/parameters/id" }
        - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
      responses: { "200": { description: The removed TrackingItem }, "404": { $ref: "#/components/responses/Error" } }
  /crews/{id}/memory/settings:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [Memory]
      summary: The crew's memory settings, whether the server can embed, and the model used when llm_id is null (state.view)
      responses: { "200": { description: MemorySettingsView, content: { application/json: { schema: { $ref: "#/components/schemas/MemorySettingsView" } } } } }
    put:
      tags: [Memory]
      summary: "Change them (crews.edit and state.manage, since they drive spend). Off always works; other modes answer 409 memory_unavailable without an embedder; 422 for a missing or unpriced model or bad weights."
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MemorySettings" } } } }
      responses: { "200": { description: MemorySettingsView }, "409": { $ref: "#/components/responses/Error" }, "422": { $ref: "#/components/responses/Error" } }
  /crews/{id}/memory:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [Memory]
      summary: "A page of the crew's memories, newest first (state.view). With q, best matches by meaning first (memories whose text contains q are kept); without an embedder, a text match."
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: scope, in: query, schema: { type: string }, description: This scope and everything below it (whole parts) }
        - { name: status, in: query, schema: { type: string, enum: [active, pending] } }
        - { name: pinned, in: query, schema: { type: boolean } }
        - { name: run_id, in: query, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/limit" }
        - { $ref: "#/components/parameters/offset" }
      responses: { "200": { description: Page of MemoryRecord }, "422": { $ref: "#/components/responses/Error" } }
    post:
      tags: [Memory]
      summary: "Add a memory by hand (state.manage); it is active at once, with source user:<name>. 409 memory_exists when the scope already holds the same text; 409 memory_unavailable without an embedder."
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [content], properties: { content: { type: string, maxLength: 2000 }, scope: { type: string }, categories: { type: array, maxItems: 10, items: { type: string } }, importance: { type: number }, pinned: { type: boolean }, metadata: { type: object } } } } } }
      responses: { "201": { description: The MemoryRecord }, "409": { $ref: "#/components/responses/Error" }, "422": { $ref: "#/components/responses/Error" }, "429": { $ref: "#/components/responses/Error" } }
  /crews/{id}/memory/scopes:
    get:
      tags: [Memory]
      summary: "Every scope holding memories, with how many (state.view): [{ scope, count }]"
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses: { "200": { description: "List of { scope, count }" } }
  /crews/{id}/memory/delete:
    post:
      tags: [Memory]
      summary: "Delete many memories, pinned ones included (state.manage): a scope and everything below it, memories whose text contains something (such as a person's name), and/or ids; the filters combine. dry_run only counts (deleted 0)."
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { scope_prefix: { type: string }, contains: { type: string }, ids: { type: array, items: { type: string, format: uuid } }, dry_run: { type: boolean } } } } } }
      responses: { "200": { description: "{ matched, deleted }" }, "422": { $ref: "#/components/responses/Error" } }
  /crews/{id}/memory/promote:
    post:
      tags: [Memory]
      summary: "Turn memories into one KM2 document through the crew's only KM2 connection, which must be in your areas (state.manage). Same save path as km_save_document: the connection's folders, a km2:save action log entry (no run), 200 saves per connection a day (429 km2_day_cap) and 20 promotions per person a day (429 km2_promote_cap). external_ref defaults to crew-memory-<crew>-<hash of the ids>. Pending memories are refused (422 memory_ids: approve these memories first). Field errors are keyed memory_ids, title, folder or external_ref."
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [memory_ids, title], properties: { memory_ids: { type: array, minItems: 1, maxItems: 50, items: { type: string, format: uuid } }, title: { type: string, maxLength: 255 }, folder: { type: string }, external_ref: { type: string } } } } } }
      responses: { "200": { description: "{ outcome, document_id, external_ref, folder_id }; outcome is KM2's (created, updated, unchanged, ...) or already_saved" }, "409": { $ref: "#/components/responses/Error" }, "422": { $ref: "#/components/responses/Error" }, "429": { $ref: "#/components/responses/Error" }, "502": { $ref: "#/components/responses/Error" } }
  /crews/{id}/memory/promote/folders:
    get:
      tags: [Memory]
      summary: "The folders of the KM2 connection promoting this crew's memories saves through, for the folder picker (state.manage; the same budget as testing a KM2 connection)"
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses: { "200": { description: "As GET /connections/{id}/km2/folders" }, "409": { $ref: "#/components/responses/Error" }, "429": { $ref: "#/components/responses/Error" } }
  /crews/{id}/memory/{mid}:
    parameters:
      - { $ref: "#/components/parameters/id" }
      - { name: mid, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Memory]
      summary: "Change a memory (state.manage); status active approves a pending one. A new content is embedded again."
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { content: { type: string }, scope: { type: string }, categories: { type: array, items: { type: string } }, importance: { type: number }, pinned: { type: boolean }, metadata: { type: object }, status: { type: string, enum: [active] } } } } } }
      responses: { "200": { description: The MemoryRecord }, "404": { $ref: "#/components/responses/Error" }, "409": { $ref: "#/components/responses/Error" }, "422": { $ref: "#/components/responses/Error" } }
    delete:
      tags: [Memory]
      summary: Delete a memory (state.manage)
      responses: { "204": { description: Deleted }, "404": { $ref: "#/components/responses/Error" } }
  /crews/{id}/chat:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [Chat]
      summary: The crew's chat settings (crews.view); a crew nobody set up has chat off and the default budget
      responses: { "200": { description: ChatSettings, content: { application/json: { schema: { $ref: "#/components/schemas/ChatSettings" } } } } }
    put:
      tags: [Chat]
      summary: Turn chat on or off, pick the front desk agent (one of the crew's agents), the chat model and the daily budget per conversation (crews.edit)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ChatSettings" } } } }
      responses: { "200": { description: ChatSettings }, "422": { $ref: "#/components/responses/Error" } }
  /agents/{id}/chat:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [Chat]
      summary: The agent's chat settings (agents.view); an agent nobody set up has chat off
      responses: { "200": { description: AgentChatSettings, content: { application/json: { schema: { $ref: "#/components/schemas/AgentChatSettings" } } } } }
    put:
      tags: [Chat]
      summary: Turn agent chat on or off, and pick the chat model, the specialists it may ask, the crews it may start and the budgets (agents.edit)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AgentChatSettings" } } } }
      responses: { "200": { description: AgentChatSettings }, "422": { $ref: "#/components/responses/Error" } }
  /crews/{id}/escalation:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [Human input]
      summary: The crew's rules for asking a person (crews.view); a crew nobody set up has escalation off
      responses: { "200": { description: EscalationSettings, content: { application/json: { schema: { $ref: "#/components/schemas/EscalationSettings" } } } } }
    put:
      tags: [Human input]
      summary: Turn asking on or off, and set the rules, the wait, what happens on timeout and the questions per run (crews.edit)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/EscalationSettings" } } } }
      responses: { "200": { description: EscalationSettings }, "422": { $ref: "#/components/responses/Error" } }
  /questions:
    get:
      tags: [Human input]
      summary: "Open questions waiting on you, soonest deadline first (at most 100); questions from agent chat hand-offs only when signed in, not with an API key"
      responses: { "200": { description: List of HumanQuestion, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/HumanQuestion" } } } } } }
  /questions/stream:
    get:
      tags: [Human input]
      summary: "Server-Sent Events: a questions event with your open questions on connect and whenever one is asked, answered or times out"
      responses: { "200": { description: text/event-stream } }
  /questions/{id}/answer:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      tags: [Human input]
      summary: "Answer a question waiting on you; the run carries on at once. A question from an agent chat's hand-off (handoff_id set) can only be answered by the conversation's owner (404 for anyone else), signed in to Crew Studio, not with an API key (403)."
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [answer], properties: { answer: { type: string, minLength: 1, maxLength: 4000 } } } } } }
      responses:
        "200": { description: HumanQuestion, content: { application/json: { schema: { $ref: "#/components/schemas/HumanQuestion" } } } }
        "403": { description: "not_your_question: it waits on someone else; forbidden: a hand-off's question answered with an API key", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "409": { description: "question_answered, question_timed_out or question_closed", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "422": { $ref: "#/components/responses/Error" }
  /work-orders/{id}/conversation:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [Work orders]
      summary: Your conversation with the crew about the work order, or null before you start one (work_orders.view, crews.chat)
      responses: { "200": { description: "ConversationView or null", content: { application/json: { schema: { oneOf: [{ $ref: "#/components/schemas/ConversationView" }, { type: "null" }] } } } } }
  /work-orders/{id}/conversation/messages:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      tags: [Work orders]
      summary: Ask the crew about the work order; starts your conversation if need be. Works whether or not the crew has chat on
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [content], properties: { content: { type: string, maxLength: 4000 } } } }, multipart/form-data: { schema: { type: object, properties: { content: { type: string, maxLength: 4000 }, file: { type: array, maxItems: 4, items: { type: string, format: binary }, description: "PNG, JPEG, GIF, WebP or PDF; at most 10 MB each, 20 MB together" } } } } } }
      responses:
        "201": { description: ConversationView, content: { application/json: { schema: { $ref: "#/components/schemas/ConversationView" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { description: "chat_turn_active, chat_budget_used or chat_person_budget_used", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "422": { $ref: "#/components/responses/Error" }
  /work-orders/{id}/conversation/compact:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      tags: [Work orders]
      summary: Compact your conversation about the work order into a summary that later turns are given instead of the messages before it
      requestBody: { content: { application/json: { schema: { type: object } } } }
      responses:
        "201": { description: ConversationView with the summary message, content: { application/json: { schema: { $ref: "#/components/schemas/ConversationView" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: "nothing_to_compact, conversation_changed, chat_turn_active, chat_budget_used or chat_person_budget_used", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
  /work-orders/{id}/feedback:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [Work orders]
      summary: Feedback given on the work order's attempts, oldest first
      responses: { "200": { description: "List of { id, work_order_id, run_id, revision_run_id, feedback, with_conversation, created_by_name, created_at }" } }
  /work-orders/{id}/revise:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      tags: [Work orders]
      summary: Start a new attempt that revises the latest one with your feedback (work_orders.create)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [feedback], properties: { feedback: { type: string, minLength: 1, maxLength: 8000 }, include_conversation: { type: boolean, description: Also give the attempt your conversation with the crew about the work order } } } } } }
      responses:
        "201": { description: "{ run, feedback }" }
        "409": { description: "not_submitted, or an attempt is queued or running", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "422": { $ref: "#/components/responses/Error" }
  /work-orders/{id}/questions:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [Human input]
      summary: Every question the work order's attempts asked, newest first (work_orders.view)
      responses: { "200": { description: List of HumanQuestion, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/HumanQuestion" } } } } } }
  /chat/crews:
    get:
      tags: [Chat]
      summary: Crews in your areas you can chat with (chat on, front desk still in the crew)
      responses: { "200": { description: "List of { id, name, description, front_desk_name, front_desk_role }" } }
  /chat/agents:
    get:
      tags: [Chat]
      summary: Agents in your areas you can chat with directly, with the specialists and crews they may use that you can see
      responses: { "200": { description: "List of { id, name, role, goal, specialists: [{ id, name, role }], crews: [{ id, name }] }" } }
  /chat/conversations:
    get:
      tags: [Chat]
      summary: Your own conversations with crews and agents, most recently used first (at most 100)
      parameters: [{ name: crew_id, in: query, schema: { type: string, format: uuid } }, { name: agent_id, in: query, schema: { type: string, format: uuid } }]
      responses: { "200": { description: List of Conversation } }
    post:
      tags: [Chat]
      summary: Start a conversation with a crew (crew_id) or an agent (agent_id) with its first message; the reply is written by a chat run (poll the conversation)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [content], properties: { crew_id: { type: string, format: uuid }, agent_id: { type: string, format: uuid, description: Agent chat; send it instead of crew_id }, content: { type: string, maxLength: 4000 } } } } } }
      responses:
        "201": { description: ConversationView, content: { application/json: { schema: { $ref: "#/components/schemas/ConversationView" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: "chat_budget_used: the daily budget is spent", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "422": { description: Invalid message, or chat is off for the crew, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "429": { $ref: "#/components/responses/Error" }
  /chat/conversations/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [Chat]
      summary: One of your conversations with its latest 200 messages and budget
      responses: { "200": { description: ConversationView, content: { application/json: { schema: { $ref: "#/components/schemas/ConversationView" } } } }, "404": { $ref: "#/components/responses/Error" } }
    delete:
      tags: [Chat]
      summary: Delete one of your conversations (its chat and hand-off runs are kept); 409 chat_turn_active while a reply is being written, handoff_active while a hand-off runs
      responses: { "204": { description: Deleted }, "404": { $ref: "#/components/responses/Error" }, "409": { $ref: "#/components/responses/Error" } }
  /chat/conversations/{id}/messages:
    post:
      tags: [Chat]
      summary: Send the next message; one turn at a time per conversation
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [content], properties: { content: { type: string, maxLength: 4000 } } } }, multipart/form-data: { schema: { type: object, properties: { content: { type: string, maxLength: 4000 }, file: { type: array, maxItems: 4, items: { type: string, format: binary }, description: "PNG, JPEG, GIF, WebP or PDF; at most 10 MB each, 20 MB together" } } } } } }
      responses:
        "201": { description: ConversationView, content: { application/json: { schema: { $ref: "#/components/schemas/ConversationView" } } } }
        "409": { description: "chat_turn_active (wait for the reply), chat_budget_used or chat_person_budget_used", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "422": { $ref: "#/components/responses/Error" }
  /chat/conversations/{id}/compact:
    post:
      tags: [Chat]
      summary: "Compact the conversation: a short turn summarises it, and later turns are given the summary and the messages after it instead of the earlier ones"
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody: { content: { application/json: { schema: { type: object } } } }
      responses:
        "201": { description: ConversationView with the summary message, content: { application/json: { schema: { $ref: "#/components/schemas/ConversationView" } } } }
        "409": { description: "nothing_to_compact (fewer than two messages since the last summary), conversation_changed, chat_turn_active, handoff_active (a hand-off is running), chat_budget_used or chat_person_budget_used", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
  /chat/messages/{id}/confirm:
    post:
      tags: [Chat]
      summary: "Apply the reply's pending proposal. Only the conversation's owner, signed in to Crew Studio (not with an API key). start_work_order also needs work_orders.create. Agent chat's tracker and KM2 cards need crews.run and post or save through the connection as you: a tracker comment ends with who confirmed it and which agent drafted it, a KM2 document carries them in its metadata."
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { description: The ChatMessage, with proposal_result }
        "403": { $ref: "#/components/responses/Error" }
        "409": { description: "proposal_decided, proposal_expired (after 24 hours), version_conflict (the note changed), crew_not_offered (agent chat: the agent may no longer start the crew), no_proposal; for start_handoff also chat_turn_active (the reply is still being written), chat_off, handoffs_off, worker_not_offered, handoffs_busy, chat_budget_used or chat_person_budget_used; for tracker_comment, tracker_suggestion, tracker_issue and km2_save (which also need crews.run, 403) chat_off, proposals_off (a specialist's card after the agent's specialists may no longer propose), proposer_not_offered (the proposing agent is no longer the lead or one of its specialists you can see, or lost the tool), connection_not_offered (off the agent's list, or outside your or the agent's areas), connection_off, create_off, tracker_busy or km2_busy (the card stays pending). A tracker or KM2 refusal answers 422 or 502 with its reason (on Linear, 422 for a text with a profile link); any write failure other than a clear refusal (4xx, rate limit) confirms the card with proposal_result { outcome: unknown, message } so it cannot post twice", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "422": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /chat/messages/{id}/decline:
    post:
      tags: [Chat]
      summary: Decline the reply's pending proposal (owner, signed in)
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses: { "200": { description: The ChatMessage }, "409": { $ref: "#/components/responses/Error" } }
  /chat/messages/{id}/undo:
    post:
      tags: [Chat]
      summary: Undo a confirmed change that can be undone (notes_put; owner, signed in). Refused when the note changed since.
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses: { "200": { description: The ChatMessage, with undone_at }, "409": { $ref: "#/components/responses/Error" } }
  /chat/conversations/{id}/questions:
    get:
      tags: [Chat]
      summary: "The questions your conversation's hand-offs asked you, open ones first (soonest due first), then the others newest first; at most 200. Answer with POST /questions/{id}/answer, signed in."
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses: { "200": { description: List of HumanQuestion, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/HumanQuestion" } } } } }, "404": { $ref: "#/components/responses/Error" } }
  /chat/handoffs/{id}:
    get:
      tags: [Chat]
      summary: One hand-off of your own conversation
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses: { "200": { description: Handoff, content: { application/json: { schema: { $ref: "#/components/schemas/Handoff" } } } }, "404": { $ref: "#/components/responses/Error" } }
  /chat/handoffs/{id}/cancel:
    post:
      tags: [Chat]
      summary: "Cancel a hand-off's run (the conversation's owner, signed in to Crew Studio, not with an API key); its result message then says it was cancelled"
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody: { content: { application/json: { schema: { type: object } } } }
      responses:
        "200": { description: The Handoff, content: { application/json: { schema: { $ref: "#/components/schemas/Handoff" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: "handoff_finished: it has already finished", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
  /run-state/scope:
    get:
      tags: [Run state]
      summary: The run's crew, schedule, areas and the connections it may use
      security: [{ runToken: [] }]
      responses: { "200": { description: "{ run_id, crew_id, crew_name, schedule_id, schedule_name, area_ids, connections, expires_at, dry_run }" }, "401": { $ref: "#/components/responses/Error" } }
  /run-state/control:
    get:
      tags: [Run state]
      summary: "What people asked of the running crew: { compact_requests }, how many times they asked to compact its agents' context"
      security: [{ runToken: [] }]
      responses: { "200": { description: "{ compact_requests }" }, "401": { $ref: "#/components/responses/Error" } }
  /run-state/notes:
    get:
      tags: [Run state]
      summary: The run's notes (latest versions, without content)
      security: [{ runToken: [] }]
      parameters: [{ name: subject, in: query, schema: { type: string } }]
      responses: { "200": { description: List } }
  /run-state/notes/{name}:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,99}$" } }
    get:
      tags: [Run state]
      summary: Latest version of a note (404 when there is none yet)
      security: [{ runToken: [] }]
      parameters: [{ name: subject, in: query, schema: { type: string } }]
      responses: { "200": { description: The NoteVersion }, "404": { $ref: "#/components/responses/Error" } }
    put:
      tags: [Run state]
      summary: Save the next version
      security: [{ runToken: [] }]
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/NotePut" } } } }
      responses: { "200": { description: The NoteVersion }, "409": { $ref: "#/components/responses/Error" }, "422": { $ref: "#/components/responses/Error" } }
  /run-state/log/check:
    get:
      tags: [Run state]
      summary: The latest matching action log entry, or null
      security: [{ runToken: [] }]
      parameters:
        - { name: subject, in: query, required: true, schema: { type: string } }
        - { name: action, in: query, required: true, schema: { type: string } }
        - { name: within, in: query, schema: { type: string, examples: [24h, 7d, 2w] } }
      responses: { "200": { description: "{ entry }" } }
  /run-state/log:
    post:
      tags: [Run state]
      summary: Record an action (201), or return the earlier entry for a repeated idempotency key (200, duplicate true). A dry-run run's entries are dry-run entries.
      security: [{ runToken: [] }]
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/LogRecord" } } } }
      responses: { "201": { description: "{ entry, duplicate }" }, "200": { description: "{ entry, duplicate: true }" } }
  /run-state/tracking:
    get:
      tags: [Run state]
      summary: The crew's tracking list (crew-wide items and the run's schedule's); runs can only read it
      security: [{ runToken: [] }]
      responses: { "200": { description: List of TrackingItem, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/TrackingItem" } } } } } }
  /run-state/trackers:
    get:
      tags: [Run state]
      summary: The Jira and Linear connections the run may use
      security: [{ runToken: [] }]
      responses: { "200": { description: "List of { id, name, kind }" } }
  /run-state/trackers/projects:
    get:
      tags: [Run state]
      summary: Jira projects or Linear teams of a connection (?connection= id or name; optional when the run has one tracker)
      security: [{ runToken: [] }]
      parameters: [{ name: connection, in: query, schema: { type: string } }]
      responses: { "200": { description: "List of { key, name, lead }" } }
  /run-state/trackers/issues:
    get:
      tags: [Run state]
      summary: Find issues in a project, filtered by code (the first 50 of up to 1,000 open issues)
      security: [{ runToken: [] }]
      parameters:
        - { name: connection, in: query, schema: { type: string } }
        - { name: project, in: query, required: true, schema: { type: string } }
        - { name: overdue, in: query, schema: { type: boolean } }
        - { name: due_within_days, in: query, schema: { type: integer } }
        - { name: not_updated_days, in: query, schema: { type: integer } }
        - { name: unassigned, in: query, schema: { type: boolean } }
        - { name: blocked, in: query, schema: { type: boolean } }
        - { name: owner, in: query, schema: { type: string } }
        - { name: include_done, in: query, schema: { type: boolean } }
      responses: { "200": { description: "{ issues, total }" } }
    post:
      tags: [Run state]
      summary: "Create an issue: only where an administrator turned on allow_create for the connection (403 create_off otherwise). A dry run creates nothing and answers would_post."
      security: [{ runToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [project, title], properties: { connection: { type: string }, project: { type: string }, title: { type: string, maxLength: 255 }, description: { type: string }, parent: { type: string } } } } } }
      responses: { "201": { description: TrackerPostResult }, "200": { description: "TrackerPostResult (dry run)" }, "403": { $ref: "#/components/responses/Error" }, "429": { $ref: "#/components/responses/Error" } }
  /run-state/trackers/issues/{ref}:
    get:
      tags: [Run state]
      summary: One issue with its 10 newest comments. Tracker text is untrusted data.
      security: [{ runToken: [] }]
      parameters:
        - { name: ref, in: path, required: true, schema: { type: string, examples: [PRJ-15, "jira:PRJ-15"] } }
        - { name: connection, in: query, schema: { type: string } }
      responses: { "200": { description: "Issue with connection and comments" }, "422": { $ref: "#/components/responses/Error" } }
  /run-state/trackers/issues/{ref}/children:
    get:
      tags: [Run state]
      summary: An issue's children, every level (depth=0, the default) or the first depth levels (at most 200)
      security: [{ runToken: [] }]
      parameters:
        - { name: ref, in: path, required: true, schema: { type: string } }
        - { name: connection, in: query, schema: { type: string } }
        - { name: depth, in: query, schema: { type: integer, minimum: 0, maximum: 5 } }
      responses: { "200": { description: "{ parent, depth, children }" } }
  /run-state/trackers/issues/{ref}/comments:
    post:
      tags: [Run state]
      summary: "Comment, mentioning people by account id. Logged in the action log (followup:<step> with followup_step, else tracker:comment). Dry run: nothing is posted (200, would_post, dry-run entry). Caps: comment_cap_per_run and mention_cap_per_day (429). Chat turns get 403."
      security: [{ runToken: [] }]
      parameters: [{ name: ref, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [text], properties: { connection: { type: string }, text: { type: string, maxLength: 10000 }, mentions: { type: array, maxItems: 10, items: { type: string } }, followup_step: { type: string } } } } } }
      responses: { "201": { description: TrackerPostResult }, "200": { description: "TrackerPostResult (dry run, or a follow-up already posted in this run)" }, "422": { $ref: "#/components/responses/Error" }, "429": { $ref: "#/components/responses/Error" } }
  /run-state/trackers/issues/{ref}/suggestions:
    post:
      tags: [Run state]
      summary: Suggest a field change as a comment; the field itself is never changed. Same logging, dry run and caps as comments.
      security: [{ runToken: [] }]
      parameters: [{ name: ref, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [field, value, reason], properties: { connection: { type: string }, field: { type: string, enum: [due_date, assignee, status, priority, title, labels, parent] }, value: { type: string }, reason: { type: string }, mentions: { type: array, items: { type: string } } } } } } }
      responses: { "201": { description: TrackerPostResult }, "200": { description: "TrackerPostResult (dry run)" }, "422": { $ref: "#/components/responses/Error" }, "429": { $ref: "#/components/responses/Error" } }
  /run-state/km2/search:
    post:
      tags: [Run state]
      summary: "km_search: semantic search in KM2 through the run's one KM2 connection (Studio picks it; 409 no_km2 or km2_ambiguous otherwise). Studio calls KM2's POST /api/v1/search with the connection's key, which never reaches the run. Chat turns need km_search in their tools."
      security: [{ runToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [query], properties: { query: { type: string, maxLength: 5000 }, top_k: { type: integer, minimum: 1, maximum: 20, default: 5 } } } } } }
      responses: { "200": { description: "{ connection, query, hits: [{ document_id, document_title, text, score, chunk_order }], total }" }, "409": { $ref: "#/components/responses/Error" }, "422": { $ref: "#/components/responses/Error" }, "429": { $ref: "#/components/responses/Error" }, "502": { $ref: "#/components/responses/Error" } }
  /run-state/km2/ask:
    post:
      tags: [Run state]
      summary: "km_ask: a KM2 answer with its sources (KM2's POST /api/v1/search/chat), as the run's KM2 connection. Per run: 6 a minute and 2 open at once (429). Chat turns need km_ask in their tools."
      security: [{ runToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [question], properties: { question: { type: string, maxLength: 5000 } } } } } }
      responses: { "200": { description: "{ connection, question, answer, sources: [object] }" }, "409": { $ref: "#/components/responses/Error" }, "422": { $ref: "#/components/responses/Error" }, "429": { $ref: "#/components/responses/Error" }, "502": { $ref: "#/components/responses/Error" } }
  /run-state/mcp/{connection_id}/tools/{name}:
    post:
      tags: [Run state]
      summary: "An MCP read tool in agent chat (slice 3e): only a crew-less agent-chat turn or hand-off, only a tool frozen into its spec's chat.mcp_tools, on a connection still enabled, visible to the person and shared with the agent (409 no_mcp), and only while the tool is still enabled and marked reads (403 mcp_tool_off). Studio calls the MCP server with the connection's secret, which never reaches the run; the result's text is cut to 64 KB and the call journalled (argument names and size, not values). Per run 30 calls a minute, per connection 120 a minute and 4 at once (429)."
      security: [{ runToken: [] }]
      parameters: [{ name: connection_id, in: path, required: true, schema: { type: string, format: uuid } }, { name: name, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_.-]{1,128}$" } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { arguments: { type: object, description: "The tool's arguments, at most 32 KB" } } } } } }
      responses: { "200": { description: "{ connection, tool, content, is_error, truncated }: content is the MCP server's words (untrusted)" }, "403": { $ref: "#/components/responses/Error" }, "404": { $ref: "#/components/responses/Error" }, "409": { $ref: "#/components/responses/Error" }, "422": { $ref: "#/components/responses/Error" }, "429": { $ref: "#/components/responses/Error" }, "502": { $ref: "#/components/responses/Error" } }
  /run-state/km2/documents:
    post:
      tags: [Run state]
      summary: "km_save_document: save text to KM2 (POST /api/v1/knowledge/documents) under external_ref; the same ref in the same folder is a new version. folder is empty (the connection's default folder), a folder id, or a folder name or path among the connection's save folders (403 km2_folder_not_allowed otherwise). Studio adds metadata source, crew, run_id and schedule. Reserved in the action log as km2:save before sending and finished with KM2's outcome (refused saves are removed; unanswered ones are kept as unknown). Dry run: nothing is saved (200, would_save, dry-run entry). At most 10 saves per run (429 km2_save_cap) and 200 per connection a day (429 km2_day_cap); the same document twice in a run is sent once (200, repeated: true; 409 km2_in_flight while sending). Chat turns get 403."
      security: [{ runToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [title, content, external_ref], properties: { title: { type: string, maxLength: 255 }, content: { type: string, description: "Up to 1 MB of text" }, external_ref: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,189}$" }, folder: { type: string }, metadata: { type: object, description: "Flat: strings, numbers, booleans, null or lists of those; at most 50 keys and 8 KiB; KM2's reserved keys are refused" }, source_file: { type: string } } } } } }
      responses: { "201": { description: "{ saved: true, outcome: created, document_id, processing_status, external_ref, folder_id, logged, message }" }, "200": { description: "The same with outcome updated, unchanged, metadata_updated or reprocessed; or a dry run ({ dry_run: true, would_save, logged }); or a repeat in this run" }, "403": { $ref: "#/components/responses/Error" }, "409": { $ref: "#/components/responses/Error" }, "422": { $ref: "#/components/responses/Error" }, "429": { $ref: "#/components/responses/Error" }, "502": { $ref: "#/components/responses/Error" } }
  /run-state/reports:
    post:
      tags: [Run state]
      summary: "deliver_report: one project's report (Markdown, at most 64 KB) with an optional cadence, weekly (the default) or daily (anything else is 400 bad_cadence). Studio keeps it as the project's weekly-report note, or a daily report as its daily-report note (subject project:<slug>), and sends it to the work order output and every destination of the run's schedule, logging each delivery as report:<kind> (subject project:<slug>) under an idempotency key. KM2 gets a document with external_ref <slug>-weekly-<ISO week> or <slug>-daily-<local date>. The answer has cadence and period (the ISO week, or the daily report's date in the schedule's time zone). Dry run: nothing is sent (statuses would_send, dry-run entries). The same report again in the run answers 200 and sends nothing; different text for the same project and cadence is 409 report_exists. Caps: 20 reports and 60 sends per run (429 report_cap). Chat turns get 403. The markdown is the narrative: Studio reads the project's tracked items itself (20 seconds at most), stores them with the report as its snapshot and builds the deliveries from them (email gets a designed HTML part, Slack and Teams a summary, KM2 the data as Markdown with the narrative); when the tracker cannot be read the report goes as written, and the action log's details.snapshot says why."
      security: [{ runToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [project, markdown], properties: { project: { type: string, maxLength: 100 }, markdown: { type: string, maxLength: 65536 }, cadence: { type: string, enum: [weekly, daily], default: weekly } } } } } }
      responses: { "201": { description: "{ report_id, project, week, dry_run, deliveries: [{ destination, target, status, message }], message }" }, "200": { description: The same report, already delivered in this run }, "409": { $ref: "#/components/responses/Error" }, "422": { $ref: "#/components/responses/Error" }, "429": { $ref: "#/components/responses/Error" } }
  /run-state/proposals:
    post:
      tags: [Run state]
      summary: "Chat turns only: attach a proposal (start_work_order or notes_put) to the reply the run is writing; at most one per reply. Other runs get 403. Chat turns get 403 from PUT /run-state/notes/{name} and POST /run-state/log. An agent chat turn (no crew) may call only this, GET /run-state/control, and the tracker and KM2 reads (GET /run-state/trackers, /trackers/projects, /trackers/issues, /trackers/issues/{ref}, /trackers/issues/{ref}/children; POST /run-state/km2/search, /km2/ask) when one of its agents has the tool, through the agent's listed connections that are still enabled, that the person can still see and that still share an area with the agent; a path with encoded characters, and everything else, is 403. A start_work_order whose inputs (by key) leave out a required input without a default, or name a key the crew does not have, is 422 with details naming the keys. start_handoff ({ worker, title, brief }; the worker by role, name or id: the agent or one of the turn's specialists) comes only from an agent chat turn whose lead was given Hand off work. A hand-off run (kind handoff) has the same allowlist as an agent chat turn; each of its proposals is a message of its own (handoff set, no run), at most 5 per hand-off (409 too_many_proposals), and start_handoff from it is 403 no_chains. In agent chat, tracker_comment ({ connection, issue, text }), tracker_suggestion ({ connection, issue, field, value, reason }), tracker_issue ({ connection, project, title, description, parent }; 409 create_off unless the connection lets crews create issues) and km2_save ({ connection, title, external_ref, content, folder }; the external_ref is kept under agent-chat-<12 hex characters of the conversation id>-) come from the counterparts of an agent's changing tools: connection is a name or id of the turn's connections of that kind (empty: the only one). Studio records the connection and which agent proposed it (from the X-Crew-Agent role, which must be an agent of the turn given that counterpart; 403 otherwise). Hidden characters are dropped from the text; on Linear a text with a profile link is 422."
      security: [{ runToken: [] }]
      requestBody: { content: { application/json: { schema: { type: object, required: [type, payload], properties: { type: { type: string, enum: [start_work_order, notes_put, tracking_add, tracking_remove, start_handoff, tracker_comment, tracker_suggestion, tracker_issue, km2_save] }, payload: { type: object } } } } } }
      responses: { "201": { description: "{ message_id, proposal, state: pending }" }, "403": { $ref: "#/components/responses/Error" }, "409": { $ref: "#/components/responses/Error" }, "422": { $ref: "#/components/responses/Error" } }
  /run-state/memory/embed:
    post:
      tags: [Run state]
      summary: "Embed 1 to 32 texts with the server's embedder (kind query while recalling, otherwise document). At most 300 texts per run are sent to the provider (429 memory_embed_cap); repeats come from a per-run cache. Not journalled. Every memory call answers 403 memory_off when memory is off for the run, and 503 memory_unavailable without an embedder."
      security: [{ runToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [texts], properties: { texts: { type: array, minItems: 1, maxItems: 32, items: { type: string } }, kind: { type: string, enum: [query, document] } } } } } }
      responses: { "200": { description: "{ model, dimensions, vectors }" }, "403": { $ref: "#/components/responses/Error" }, "429": { $ref: "#/components/responses/Error" }, "503": { $ref: "#/components/responses/Error" } }
  /run-state/memory/search:
    post:
      tags: [Run state]
      summary: "Rank the crew's memories by cosine similarity (0..1): active ones and those this run saved, embedded with the current model, scoring at least the larger of min_score and the embedder's relevance floor. Journal: Memory: recalled n of m."
      security: [{ runToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [embedding], properties: { embedding: { type: array, items: { type: number } }, scope_prefix: { type: string }, categories: { type: array, items: { type: string } }, metadata_filter: { type: object }, limit: { type: integer, minimum: 1, maximum: 50, default: 10 }, min_score: { type: number, minimum: 0, maximum: 1 } } } } } }
      responses: { "200": { description: "{ matches: [{ record: MemoryRecord, score }] }" }, "422": { $ref: "#/components/responses/Error" } }
  /run-state/memory/records:
    get:
      tags: [Run state]
      summary: The memories this run may see, newest first
      security: [{ runToken: [] }]
      parameters:
        - { name: scope_prefix, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 200 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
      responses: { "200": { description: "{ records }" } }
    post:
      tags: [Run state]
      summary: "Save 1 to 20 memories (not in recall-only mode: 403 memory_read_only). The server embeds them; among the memories this run may see, the same text in the same scope, or a near-duplicate in the same scope (the embedder's threshold), is touched instead (duplicate true). While review_run_saves is on they are saved pending. One saved entry per record; a skipped one has empty id and status and skipped save_cap, crew_full (5,000 memories), pending_full (500 waiting for review) or not_saved (no detail). When none could be saved for a cap, 429 memory_save_cap, memory_crew_full or memory_pending_full. Content and metadata strings with control, separator or format characters answer 422."
      security: [{ runToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [records], properties: { records: { type: array, minItems: 1, maxItems: 20, items: { type: object, required: [content], properties: { id: { type: string, format: uuid }, content: { type: string, maxLength: 2000 }, scope: { type: string }, categories: { type: array, maxItems: 10, items: { type: string } }, metadata: { type: object, description: "Flat, at most 20 keys and 4 KB" }, importance: { type: number, minimum: 0, maximum: 1 } } } } } } } } }
      responses: { "201": { description: "{ saved: [{ id, duplicate, status, skipped? }], skipped, remaining_saves }" }, "403": { $ref: "#/components/responses/Error" }, "422": { $ref: "#/components/responses/Error" }, "429": { $ref: "#/components/responses/Error" } }
  /run-state/memory/records/{mid}:
    parameters: [{ name: mid, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [Run state]
      summary: One memory the run may see (404 otherwise)
      security: [{ runToken: [] }]
      responses: { "200": { description: MemoryRecord }, "404": { $ref: "#/components/responses/Error" } }
    patch:
      tags: [Run state]
      summary: "Change a memory this run saved (403 memory_not_owned otherwise) that no person pinned or, while review is on, approved (403 memory_locked); a new content is embedded again"
      security: [{ runToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { content: { type: string }, scope: { type: string }, categories: { type: array, items: { type: string } }, metadata: { type: object }, importance: { type: number } } } } } }
      responses: { "200": { description: MemoryRecord }, "403": { $ref: "#/components/responses/Error" }, "409": { $ref: "#/components/responses/Error" } }
  /run-state/memory/scopes:
    get:
      tags: [Run state]
      summary: "Scopes one level below parent: { scopes }"
      security: [{ runToken: [] }]
      parameters: [{ name: parent, in: query, schema: { type: string, default: / } }]
      responses: { "200": { description: "{ scopes }" } }
  /run-state/memory/scope-info:
    get:
      tags: [Run state]
      summary: "{ path, record_count, categories, oldest_record, newest_record, child_scopes }"
      security: [{ runToken: [] }]
      parameters: [{ name: scope, in: query, schema: { type: string } }]
      responses: { "200": { description: ScopeInfo } }
  /run-state/memory/categories:
    get:
      tags: [Run state]
      summary: "{ categories: { name: count } }"
      security: [{ runToken: [] }]
      parameters: [{ name: scope_prefix, in: query, schema: { type: string } }]
      responses: { "200": { description: "{ categories }" } }
  /run-state/memory/count:
    get:
      tags: [Run state]
      summary: "{ count }"
      security: [{ runToken: [] }]
      parameters: [{ name: scope_prefix, in: query, schema: { type: string } }]
      responses: { "200": { description: "{ count }" } }
  /run-state/memory/delete:
    post:
      tags: [Run state]
      summary: "Delete memories this run saved (never pinned ones, and while review is on only pending ones), by ids, scope, categories, age or metadata: { deleted }"
      security: [{ runToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { record_ids: { type: array, items: { type: string, format: uuid } }, scope_prefix: { type: string }, categories: { type: array, items: { type: string } }, older_than: { type: string, format: date-time }, metadata_filter: { type: object } } } } } }
      responses: { "200": { description: "{ deleted }" } }
  /run-state/memory/touch:
    post:
      tags: [Run state]
      summary: "Mark memories as just used: { touched }. Not journalled."
      security: [{ runToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { record_ids: { type: array, maxItems: 200, items: { type: string, format: uuid } } } } } } }
      responses: { "200": { description: "{ touched }" } }
