name: crewstudio

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: crewstudio
      POSTGRES_USER: crewstudio
      POSTGRES_PASSWORD: ${STUDIO_DB_PASSWORD:?Set STUDIO_DB_PASSWORD in studio/.env}
    ports:
      # Loopback only: the database is never reachable from other machines
      - "127.0.0.1:${STUDIO_DB_PORT:-55432}:5432"
    volumes:
      - crewstudio-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crewstudio -d crewstudio"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Local stand-in for Azure Blob Storage: work order attachments, files agents write, run transcripts.
  # In production point STUDIO_STORAGE_* at a real Azure Storage account or a GCS bucket instead.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    restart: unless-stopped
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--blobPort", "10000", "--location", "/data", "--skipApiVersionCheck"]
    ports:
      # Loopback only, like Postgres
      - "127.0.0.1:${STUDIO_BLOB_PORT:-10000}:10000"
    volumes:
      - crewstudio-blobdata:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 10000"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  crewstudio-pgdata:
  crewstudio-blobdata:
